---
# Shared by every scenario under molecule/. Each platform boots systemd as PID 1, because the
# real mdatp package is installed (with libre_devops.mde_linux) and its service runs. The agent
# cannot license itself or run its antivirus in a container, so the mdatp command is replaced with
# a stub (molecule/resources/mdatp-stub.py) that replays output captured from real hosts; the
# package, the service, the processes and the system are real. Pick a platform with:
# just test default rhel9 (the mck- prefix keeps these containers apart from other roles' tests)
driver:
  name: podman

platforms:
  - name: mck-rhel7
    image: registry.access.redhat.com/ubi7/ubi-init:latest
    dockerfile: ../../.config/molecule/Containerfile.j2
    command: /sbin/init
    systemd: always
  - name: mck-rhel9
    image: registry.access.redhat.com/ubi9/ubi-init:latest
    dockerfile: ../../.config/molecule/Containerfile.j2
    command: /sbin/init
    systemd: always
  - name: mck-debian12
    image: docker.io/library/debian:12
    dockerfile: ../../.config/molecule/Containerfile.j2
    command: /sbin/init
    systemd: always
  - name: mck-ubuntu2404
    image: docker.io/library/ubuntu:24.04
    dockerfile: ../../.config/molecule/Containerfile.j2
    command: /sbin/init
    systemd: always

provisioner:
  name: ansible
  config_options:
    defaults:
      callback_result_format: yaml
      interpreter_python: auto_silent
  inventory:
    host_vars:
      # RHEL 7 ships Python 2.7, which ansible-core no longer supports on targets.
      # Its systemd 219 cannot run as PID 1 on a cgroup v2 host (this one, and GitHub's runners), so
      # systemd_present rightly fails in its container.
      mck-rhel7:
        ansible_python_interpreter: /opt/python/bootstrap/bin/python3
        __verify_systemd_runs: false

verifier:
  name: ansible
