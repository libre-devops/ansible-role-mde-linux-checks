---
# The stub answers with a real unlicensed RHEL 9 host's output: the checks must pass where
# the stub decides, skip what an unlicensed device cannot do, and the suite must match the report's
# format. No idempotence step: the checks write the EICAR file and update definitions every run.
scenario:
  test_sequence:
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - verify
    - destroy
provisioner:
  name: ansible
  playbooks:
    prepare: ../resources/prepare.yml
