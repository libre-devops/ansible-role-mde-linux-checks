---
# The checks on one host. mde_linux_checks_scope full (the default) runs every check, the readiness
# checks first (tasks/checks.yml); preflight runs only the readiness checks, which need no agent
# and change nothing, to find out whether a host can take Defender before installing it
# (tasks/preflight.yml). Either way the results are left in mde_linux_checks_test_results.

- name: Check the settings
  ansible.builtin.include_tasks: assert.yml

# A role earlier in the play (libre_devops.mde_linux) may have a restart of mdatp waiting: let it
# happen now, not in the middle of the checks or after them.
- name: Run the handlers earlier roles notified
  ansible.builtin.meta: flush_handlers

- name: Run the checks
  ansible.builtin.include_tasks:
    file: "{{ 'preflight.yml' if mde_linux_checks_scope == 'preflight' else 'checks.yml' }}"
